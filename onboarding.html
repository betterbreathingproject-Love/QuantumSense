<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboarding • QuantumSense</title>
    <style>
      html, body { height: 100%; }
      body {
        margin: 0;
        background: #0a0a0a;
        color: #ffffff;
        font-family: Inter, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      #journalInterface {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: start center; /* allow vertical scroll */
        overflow: auto;
        padding: 24px 0; /* breathing room for small screens */
        z-index: 1000;
        background: #000; /* solid black backdrop to prevent any bleed-through */
        pointer-events: auto; /* ensure the interface remains interactive */
      }
      /* Center content at a consistent width without affecting the game page */
      .onboarding-container {
        width: clamp(320px, 90vw, 576px);
        max-width: 90vw;
      }
    </style>
  </head>
  <body>
    <!-- Standalone mount for native onboarding (not embedded in main page) -->
    <div id="journalInterface"></div>

    <script type="module">
      // Import the onboarding manager directly and mount into this standalone page
      import { OnboardingManager } from './QuantumSense Ai Journal-Add on /src/components/OnboardingManager.js';

      const mount = document.getElementById('journalInterface');
      // When onboarding completes, return to main app entry
      const handleComplete = () => {
        try {
          // Ensure any user data saved by OnboardingManager exists
          const user = JSON.parse(localStorage.getItem('quantumsense-user-data') || '{}');
          if (user && (user.name || user.email)) {
            // Redirect to the Journal Add-on dashboard
            window.location.href = './QuantumSense%20Ai%20Journal-Add%20on%20/index.html';
            return;
          }
        } catch {}
        // Fallback: still redirect to Journal Add-on dashboard
        window.location.href = './QuantumSense%20Ai%20Journal-Add%20on%20/index.html';
      };

      // Initialize onboarding in standalone mode
      new OnboardingManager(mount, handleComplete);
    </script>
  </body>
</html>
