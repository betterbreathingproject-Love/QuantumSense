<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuantumSense Ai Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        
        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(0.75rem, 2vw, 1rem);
            max-width: 576px;
            margin: 0 auto;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.25, 0.1, 0.25, 1);
            min-height: 1024px;
            max-height: 1024px;
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
            position: relative;
        }
        
        .main-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .header {
            text-align: center;
            margin-bottom: clamp(1rem, 3vh, 2rem);
            padding: clamp(0.5rem, 2vh, 1rem) 0;
            width: 100%;
        }
        
        .app-name {
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }
        
        .app-subtitle {
            font-size: clamp(0.8rem, 2.8vw, 0.9rem);
            color: #888888;
            font-weight: 300;
            line-height: 1.4;
            max-width: 90%;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        /* Optimized for 576x1024 canvas */
        @media (min-width: 400px) and (max-width: 576px) {
            .main-container {
                padding: clamp(1rem, 2.5vw, 1.5rem);
            }
            
            .header {
                margin-bottom: clamp(1.5rem, 3vh, 2rem);
            }
            
            .app-name {
                font-size: clamp(1.2rem, 3.8vw, 1.5rem);
            }
            
            .app-subtitle {
                font-size: clamp(0.85rem, 3vw, 0.95rem);
            }
        }
        
        /* Maintain responsiveness for smaller screens */
        @media (max-width: 400px) {
            .main-container {
                padding: 0.75rem;
                min-height: 100vh;
            }
            
            .app-name {
                font-size: 1.1rem;
            }
            
            .app-subtitle {
                font-size: 0.8rem;
            }
        }
        
        /* Height-specific optimizations for 1024px canvas */
        @media (min-height: 800px) and (max-height: 1024px) {
            .main-container {
                justify-content: flex-start;
                padding-top: clamp(1rem, 3vh, 2rem);
            }
            
            .header {
                margin-bottom: clamp(1.5rem, 4vh, 2.5rem);
            }
        }
        
        /* Ensure scrolling works on shorter screens */
        @media (max-height: 800px) {
            .main-container {
                min-height: 100vh;
                height: auto;
            }
        }
        
        /* Base canvas dimensions: 576x1024 */
        .app {
            max-width: 576px;
            max-height: 1024px;
            margin: 0 auto;
            position: relative;
            background: #0a0a0a;
        }
        
        @media (max-width: 576px) {
            .app {
                max-width: 100vw;
                width: 100vw;
            }
        }
        
        @media (max-height: 1024px) {
            .app {
                max-height: 100vh;
                height: 100vh;
            }
        }
        
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            display: none; /* Hide canvas but make it available in the DOM */
        }

        /* Click-through blocker overlay: prevents any clicks from reaching the page */
        .interaction-blocker {
            position: fixed;
            inset: 0;
            z-index: 99999; /* above everything */
            background: transparent; /* invisible overlay */
            pointer-events: auto; /* capture all pointer events */
            cursor: not-allowed;
            display: none; /* HIDE by default so the page is clickable */
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "components/JournalApp.js": "./src/components/JournalApp.js",
                "components/OnboardingManager.js": "./src/components/OnboardingManager.js",
                "utils/AIHelper.js": "./src/utils/AIHelper.js",
                "components/ChatAI.js": "./src/components/ChatAI.js",
                "utils/aiProvider.js": "./src/utils/aiProvider.js"
            }
        }
        </script>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="app">
        <div class="main-container visible" id="mainContainer">
            <!-- Header content removed -->
            
            <div id="calendarContainer" style="width: 100%; max-width: 576px;">
                <!-- Calendar will be inserted here -->
            </div>
            
            <div id="journalInterface" style="width: 100%; max-width: 576px;">
                <!-- Journal interface will be inserted here -->
            </div>
        </div>
    </div>
    
    <script type="module" src="src/main.js"></script>
    <!-- Load AiIntroDataBridge as a module to support ES exports -->
    <script type="module" src="./assets/AiIntroDataBridge.js"></script>
    
    <!-- Full-screen overlay to prevent click-through on this page -->
    <div id="interaction-blocker" class="interaction-blocker" aria-hidden="true"></div>
    <script>
      // Helper toggle functions, available in DevTools if you need to re-enable interaction.
      window.blockInteraction = function() {
        const el = document.getElementById('interaction-blocker');
        if (el) el.style.display = '';
      };
      window.unblockInteraction = function() {
        const el = document.getElementById('interaction-blocker');
        if (el) el.style.display = 'none';
      };
      // Do NOT block by default; keep interactions enabled on load.
      // Use window.blockInteraction() in DevTools if you need to temporarily block clicks.
      window.unblockInteraction();
    </script>
</body>
</html>
